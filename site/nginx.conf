# Send "/" to /es/ when the browser's first language is Spanish, unless the
# visitor already picked a language with the EN/ES switch (lang cookie).
map $http_accept_language $prefers_es {
    default 0;
    "~*^es" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    location = / {
        set $to_es $prefers_es;
        if ($cookie_lang) {
            set $to_es 0;
        }
        if ($to_es) {
            return 302 /es/;
        }
        add_header Vary "Accept-Language, Cookie";
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Fonts never change; everything else is revalidated so a rebuild shows up at once.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(html|css|js|json|csv)$ {
        add_header Cache-Control "no-cache";
    }
}
