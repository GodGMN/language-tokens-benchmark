name: Harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  grader-and-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s benchmark/tests -v
      - run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - run: python3 benchmark/runner.py --language oracle --round round-2
      - run: python3 benchmark/runner.py --language oracle --round round-8-expr
      - run: python3 benchmark/runner.py --language oracle --round round-9-patch
